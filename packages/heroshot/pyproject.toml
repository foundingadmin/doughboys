[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heroshot"
version = "0.1.0"
description = "AI product photography pipeline for Claude Code: explore, approve, 4K render, rebuild the backdrop, review in Figma, hand off."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pillow",
  "numpy",
  "opencv-python-headless",
  "rembg[cpu]",
]

[project.scripts]
heroshot = "heroshot.cli:main"

[tool.setuptools]
packages = ["heroshot"]
include-package-data = true

[tool.setuptools.package-data]
heroshot = ["scaffold/**/*", "scaffold/**/.*"]
